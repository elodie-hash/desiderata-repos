<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desiderata de repos</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root { --bleu:#1f5fbf; --bleu-clair:#e8f0fc; --gris-we:#d9d9d9; --bord:#b9c4d6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Segoe UI, Arial, sans-serif; font-size:13px; color:#1b2433; background:#f4f6fa; }
  .titre { background:var(--bleu); color:#fff; text-align:center; font-weight:700; font-size:20px; letter-spacing:1px; padding:12px 8px; }
  .barre { display:flex; align-items:center; justify-content:center; gap:10px; padding:10px; flex-wrap:wrap; }
  .barre .periode { font-weight:700; min-width:230px; text-align:center; }
  button { font:inherit; cursor:pointer; border:1px solid var(--bleu); background:#fff; color:var(--bleu); border-radius:6px; padding:6px 12px; }
  button:hover { background:var(--bleu-clair); }
  button.plein { background:var(--bleu); color:#fff; }
  button.plein:hover { background:#174a96; }
  button.fleche { font-size:16px; font-weight:700; padding:4px 12px; }
  .legende { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:0 10px 8px; }
  .pastille { display:inline-block; min-width:42px; text-align:center; padding:2px 8px; border-radius:4px; font-weight:700; font-size:12px; }
  .erreur { color:#b00020; background:#fdecea; border:1px solid #f5c2c0; margin:8px 12px; padding:8px 12px; border-radius:6px; display:none; }
  .zone { overflow-x:auto; padding:0 12px 12px; }
  table { border-collapse:collapse; background:#fff; }
  th, td { border:1px solid var(--bord); text-align:center; padding:0; }
  th.sem { background:var(--bleu); color:#fff; padding:5px 4px; font-size:12px; letter-spacing:.5px; }
  th.jour { background:var(--bleu-clair); font-weight:600; font-size:11px; min-width:38px; padding:3px 2px; line-height:1.2; }
  th.jour.we { background:var(--gris-we); }
  th.coin { background:var(--bleu); color:#fff; min-width:150px; position:sticky; left:0; z-index:2; }
  th.fin { background:var(--bleu); color:#fff; min-width:72px; font-size:11px; padding:4px; }
  td.nom { text-align:left; padding:4px 8px; font-weight:600; background:#fff; position:sticky; left:0; z-index:1; white-space:nowrap; }
  td.nom .x { float:right; margin-left:10px; border:none; background:none; color:#999; padding:0 4px; font-size:15px; }
  td.nom .x:hover { color:#b00020; background:none; }
  td.case { height:40px; min-width:38px; cursor:pointer; vertical-align:top; padding:2px 1px; }
  td.case.we { background:var(--gris-we); }
  td.case:hover { outline:2px solid var(--bleu); outline-offset:-2px; }
  td.case .code { font-weight:700; font-size:12px; line-height:1.2; }
  td.case .mention { writing-mode:vertical-rl; transform:rotate(180deg); font-size:10px; max-height:58px; overflow:hidden; margin:2px auto 0; white-space:nowrap; }
  td.total { font-weight:700; font-size:15px; background:var(--bleu-clair); }
  .ajout { display:flex; gap:8px; justify-content:center; padding:4px 12px 16px; flex-wrap:wrap; }
  .ajout input { padding:6px 10px; border:1px solid var(--bord); border-radius:6px; font:inherit; min-width:220px; }
  .voile { position:fixed; inset:0; background:rgba(20,30,50,.45); display:none; align-items:center; justify-content:center; z-index:10; }
  .voile.ouvert { display:flex; }
  .boite { background:#fff; border-radius:10px; padding:16px 18px; width:min(420px,92vw); box-shadow:0 8px 30px rgba(0,0,0,.3); }
  .boite h3 { margin:0 0 4px; font-size:16px; color:var(--bleu); }
  .boite .sous { margin-bottom:12px; color:#555; }
  .codes { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .codes button { border:2px solid transparent; font-weight:700; min-width:54px; }
  .codes button.choisi { border-color:#1b2433; box-shadow:0 0 0 2px #fff inset; }
  .champ { margin-bottom:10px; }
  .champ label { display:block; font-weight:600; margin-bottom:3px; }
  .champ input { width:100%; padding:6px 10px; border:1px solid var(--bord); border-radius:6px; font:inherit; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:12px; flex-wrap:wrap; }
  .actions .danger { color:#b00020; border-color:#b00020; }
</style>
</head>
<body>

<div class="titre">DESIDERATA DE REPOS</div>

<div class="barre">
  <button class="fleche" id="btnPrec4" title="Tranche précédente">&laquo;</button>
  <button class="fleche" id="btnPrec1" title="Semaine précédente">&lsaquo;</button>
  <div class="periode" id="periode"></div>
  <button class="fleche" id="btnSuiv1" title="Semaine suivante">&rsaquo;</button>
  <button class="fleche" id="btnSuiv4" title="Tranche suivante">&raquo;</button>
  <button id="btnAuj">Tranche actuelle</button>
</div>

<div class="legende" id="legende"></div>
<div class="erreur" id="erreur"></div>

<div class="zone"><table id="tableau"></table></div>

<div class="ajout">
  <input id="nouveauNom" type="text" placeholder="Nom du militaire à ajouter">
  <button class="plein" id="btnAjout">Ajouter un militaire</button>
</div>

<!-- Fenêtre de saisie d'une case -->
<div class="voile" id="voileSaisie">
  <div class="boite">
    <h3 id="saisieTitre"></h3>
    <div class="sous" id="saisieSous"></div>
    <div class="codes" id="saisieCodes"></div>
    <div class="champ"><label for="saisieMention">Mention libre (facultatif)</label><input id="saisieMention" type="text" maxlength="60"></div>
    <div class="champ"><label for="saisieFin">Appliquer jusqu'au (inclus)</label><input id="saisieFin" type="date"></div>
    <div class="actions">
      <button class="danger" id="saisieEffacer">Effacer</button>
      <button id="saisieAnnuler">Annuler</button>
      <button class="plein" id="saisieOk">Enregistrer</button>
    </div>
  </div>
</div>

<!-- Fenêtre de confirmation de suppression -->
<div class="voile" id="voileSuppr">
  <div class="boite">
    <h3>Retirer ce militaire ?</h3>
    <div class="sous" id="supprTexte"></div>
    <div class="actions">
      <button id="supprAnnuler">Annuler</button>
      <button class="plein" id="supprOk">Retirer</button>
    </div>
  </div>
</div>

<script>
const DAY = 86400000;
const DEBUT = Date.UTC(2026, 10, 2);           // lundi 02/11/2026 : début de la première tranche
const JOURS = ['L','M','M','J','V','S','D'];
const CODES = [
  { code:'R',   fond:'#43a047', texte:'#fff' },
  { code:'R+',  fond:'#43a047', texte:'#fff' },
  { code:'P',   fond:'#e53935', texte:'#fff' },
  { code:'INST',fond:'#fdd835', texte:'#222' },
  { code:'SEP', fond:'#1e88e5', texte:'#fff' },
  { code:'RR',  fond:'#1b5e20', texte:'#fff' },
  { code:'RPC', fond:'#000000', texte:'#fff' }
];
const COMPTE_WE = ['R','R+','RR','P','RPC'];   // codes comptés pour les week-ends occupés

let personnel = [];
let desid = new Map();   // clé "idPersonnel_jourMs" -> {id, code, mention}
let hasOrdre = false;
let debutAffiche = DEBUT;   // lundi de la première semaine affichée
let saisie = null;          // case en cours de saisie
let codeChoisi = '';
let suppr = null;

const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const p2 = n => String(n).padStart(2, '0');
function fmt(ms) { const d = new Date(ms); return p2(d.getUTCDate()) + '/' + p2(d.getUTCMonth() + 1); }
function fmtFull(ms) { return fmt(ms) + '/' + new Date(ms).getUTCFullYear(); }
function iso(ms) { const d = new Date(ms); return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()); }
function fromIso(s) { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function isoWeek(ms) {
  const d = new Date(ms);
  const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  t.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7) + 3);
  const jeudi1 = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  return 1 + Math.round(((t - jeudi1) / DAY - 3 + ((jeudi1.getUTCDay() + 6) % 7)) / 7);
}
function styleCode(code) { return CODES.find(c => c.code === code); }
function erreur(msg) { const e = $('erreur'); e.textContent = msg; e.style.display = msg ? 'block' : 'none'; }

/* ---------- Lecture des données ---------- */
async function charger() {
  try {
    const pt = await grist.docApi.fetchTable('Personnel');
    const dt = await grist.docApi.fetchTable('Desiderata');
    hasOrdre = 'Ordre' in pt;
    personnel = pt.id.map((id, i) => ({ id, nom: pt.Nom[i] || '', ordre: hasOrdre ? (pt.Ordre[i] || 0) : 0 }));
    personnel.sort((a, b) => hasOrdre ? (a.ordre - b.ordre || a.id - b.id) : a.id - b.id);
    desid = new Map();
    dt.id.forEach((id, i) => {
      const pid = dt.Personnel ? dt.Personnel[i] : null;
      const d = dt.Date ? dt.Date[i] : null;
      if (!pid || d == null) return;
      const ms = Math.floor(d * 1000 / DAY) * DAY;
      desid.set(pid + '_' + ms, {
        id,
        code: (dt.Code && dt.Code[i]) || '',
        mention: (dt.Mention && dt.Mention[i]) || ''
      });
    });
    erreur('');
    render();
  } catch (e) {
    erreur("Lecture impossible : vérifiez que les tables « Personnel » (colonne Nom) et « Desiderata » (colonnes Personnel, Date, Code, Mention) existent et que le widget a l'accès complet. Détail : " + (e && e.message ? e.message : e));
  }
}

/* ---------- Affichage ---------- */
function render() {
  const fin = debutAffiche + 27 * DAY;
  $('periode').textContent = 'Du ' + fmtFull(debutAffiche) + ' au ' + fmtFull(fin);

  const t = $('tableau');
  t.textContent = '';
  const thead = el('thead');

  const r1 = el('tr');
  const coin = el('th', 'coin', 'Militaire'); coin.rowSpan = 2; r1.appendChild(coin);
  for (let s = 0; s < 4; s++) {
    const th = el('th', 'sem', 'SEMAINE ' + isoWeek(debutAffiche + s * 7 * DAY));
    th.colSpan = 7; r1.appendChild(th);
  }
  const fin1 = el('th', 'fin', 'Week-ends occupés'); fin1.rowSpan = 2; r1.appendChild(fin1);
  thead.appendChild(r1);

  const r2 = el('tr');
  for (let i = 0; i < 28; i++) {
    const ms = debutAffiche + i * DAY;
    const we = (i % 7) >= 5;
    const th = el('th', 'jour' + (we ? ' we' : ''));
    th.appendChild(document.createTextNode(JOURS[i % 7]));
    th.appendChild(el('br'));
    th.appendChild(document.createTextNode(fmt(ms)));
    r2.appendChild(th);
  }
  thead.appendChild(r2);
  t.appendChild(thead);

  const tbody = el('tbody');
  if (!personnel.length) {
    const tr = el('tr'); const td = el('td', '', 'Aucun militaire : ajoutez-en un avec le champ ci-dessous.');
    td.colSpan = 30; td.style.padding = '14px'; tr.appendChild(td); tbody.appendChild(tr);
  }
  personnel.forEach(p => {
    const tr = el('tr');
    const tdNom = el('td', 'nom');
    tdNom.appendChild(document.createTextNode(p.nom));
    const x = el('button', 'x', '×'); x.title = 'Retirer ce militaire';
    x.onclick = () => ouvrirSuppr(p);
    tdNom.appendChild(x);
    tr.appendChild(tdNom);

    let nbWE = 0;
    for (let i = 0; i < 28; i++) {
      const ms = debutAffiche + i * DAY;
      const we = (i % 7) >= 5;
      const d = desid.get(p.id + '_' + ms);
      const td = el('td', 'case' + (we ? ' we' : ''));
      if (d && d.code) {
        const st = styleCode(d.code);
        if (st) { td.style.background = st.fond; td.style.color = st.texte; }
        td.appendChild(el('div', 'code', d.code));
      }
      if (d && d.mention) {
        td.appendChild(el('div', 'mention', d.mention));
        td.title = d.mention;
      }
      td.onclick = () => ouvrirSaisie(p, ms);
      tr.appendChild(td);
    }
    for (let s = 0; s < 4; s++) {
      const sam = desid.get(p.id + '_' + (debutAffiche + (s * 7 + 5) * DAY));
      const dim = desid.get(p.id + '_' + (debutAffiche + (s * 7 + 6) * DAY));
      if ((sam && COMPTE_WE.includes(sam.code)) || (dim && COMPTE_WE.includes(dim.code))) nbWE++;
    }
    tr.appendChild(el('td', 'total', String(nbWE)));
    tbody.appendChild(tr);
  });
  t.appendChild(tbody);
}

function dessinerLegende() {
  const l = $('legende');
  CODES.forEach(c => {
    const s = el('span', 'pastille', c.code);
    s.style.background = c.fond; s.style.color = c.texte;
    l.appendChild(s);
  });
}

/* ---------- Écriture ---------- */
async function enregistrer(pid, debutMs, finMs, code, mention) {
  const actions = [];
  for (let d = debutMs; d <= finMs; d += DAY) {
    const ex = desid.get(pid + '_' + d);
    if (!code && !mention) {
      if (ex) actions.push(['RemoveRecord', 'Desiderata', ex.id]);
    } else if (ex) {
      actions.push(['UpdateRecord', 'Desiderata', ex.id, { Code: code, Mention: mention }]);
    } else {
      actions.push(['AddRecord', 'Desiderata', null, { Personnel: pid, Date: d / 1000, Code: code, Mention: mention }]);
    }
  }
  if (actions.length) await grist.docApi.applyUserActions(actions);
  await charger();
}

/* ---------- Fenêtre de saisie ---------- */
function ouvrirSaisie(p, ms) {
  saisie = { p, ms };
  const ex = desid.get(p.id + '_' + ms);
  codeChoisi = ex ? ex.code : '';
  $('saisieTitre').textContent = p.nom;
  $('saisieSous').textContent = JOURS[((new Date(ms).getUTCDay() + 6) % 7)] + ' ' + fmtFull(ms);
  $('saisieMention').value = ex ? ex.mention : '';
  $('saisieFin').value = iso(ms);
  $('saisieFin').min = iso(ms);
  majBoutonsCodes();
  $('voileSaisie').classList.add('ouvert');
}
function majBoutonsCodes() {
  const zone = $('saisieCodes');
  zone.textContent = '';
  CODES.forEach(c => {
    const b = el('button', codeChoisi === c.code ? 'choisi' : '', c.code);
    b.style.background = c.fond; b.style.color = c.texte;
    b.onclick = () => { codeChoisi = (codeChoisi === c.code) ? '' : c.code; majBoutonsCodes(); };
    zone.appendChild(b);
  });
}
function fermerSaisie() { saisie = null; $('voileSaisie').classList.remove('ouvert'); }
function plageSaisie() {
  let fin = fromIso($('saisieFin').value || iso(saisie.ms));
  if (fin < saisie.ms) fin = saisie.ms;
  if (fin > saisie.ms + 365 * DAY) fin = saisie.ms + 365 * DAY;
  return fin;
}
$('saisieAnnuler').onclick = fermerSaisie;
$('saisieOk').onclick = async () => {
  if (!saisie) return;
  const s = saisie, fin = plageSaisie(), mention = $('saisieMention').value.trim();
  fermerSaisie();
  await enregistrer(s.p.id, s.ms, fin, codeChoisi, mention);
};
$('saisieEffacer').onclick = async () => {
  if (!saisie) return;
  const s = saisie, fin = plageSaisie();
  fermerSaisie();
  await enregistrer(s.p.id, s.ms, fin, '', '');
};

/* ---------- Ajout / suppression de militaires ---------- */
$('btnAjout').onclick = ajouterMilitaire;
$('nouveauNom').addEventListener('keydown', e => { if (e.key === 'Enter') ajouterMilitaire(); });
async function ajouterMilitaire() {
  const nom = $('nouveauNom').value.trim();
  if (!nom) return;
  const champs = { Nom: nom };
  if (hasOrdre) champs.Ordre = personnel.reduce((m, p) => Math.max(m, p.ordre || 0), 0) + 1;
  await grist.docApi.applyUserActions([['AddRecord', 'Personnel', null, champs]]);
  $('nouveauNom').value = '';
  await charger();
}
function ouvrirSuppr(p) {
  suppr = p;
  $('supprTexte').textContent = p.nom + ' sera retiré de la liste, avec tous ses désidératas.';
  $('voileSuppr').classList.add('ouvert');
}
$('supprAnnuler').onclick = () => { suppr = null; $('voileSuppr').classList.remove('ouvert'); };
$('supprOk').onclick = async () => {
  if (!suppr) return;
  const p = suppr; suppr = null;
  $('voileSuppr').classList.remove('ouvert');
  const ids = [];
  desid.forEach((v, k) => { if (k.startsWith(p.id + '_')) ids.push(v.id); });
  const actions = [];
  if (ids.length) actions.push(['BulkRemoveRecord', 'Desiderata', ids]);
  actions.push(['RemoveRecord', 'Personnel', p.id]);
  await grist.docApi.applyUserActions(actions);
  await charger();
};

/* ---------- Navigation ---------- */
$('btnPrec4').onclick = () => { debutAffiche -= 28 * DAY; render(); };
$('btnSuiv4').onclick = () => { debutAffiche += 28 * DAY; render(); };
$('btnPrec1').onclick = () => { debutAffiche -= 7 * DAY; render(); };
$('btnSuiv1').onclick = () => { debutAffiche += 7 * DAY; render(); };
$('btnAuj').onclick = () => {
  const n = new Date();
  const auj = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  const k = Math.floor((auj - DEBUT) / (28 * DAY));
  debutAffiche = DEBUT + Math.max(0, k) * 28 * DAY;
  render();
};

/* ---------- Démarrage ---------- */
dessinerLegende();
grist.ready({ requiredAccess: 'full' });
charger();
// Rafraîchissement régulier pour voir les saisies des collègues (sans gêner une saisie en cours)
setInterval(() => { if (!saisie && !suppr) charger(); }, 30000);
</script>
</body>
</html>
